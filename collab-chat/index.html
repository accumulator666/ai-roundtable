<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Roundtable</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #58a6ff; }
  header .controls { display: flex; gap: 8px; }
  .btn {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn:hover { background: #30363d; }
  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  /* Sidebar */
  #sidebar {
    width: 260px;
    background: #161b22;
    border-right: 1px solid #30363d;
    overflow-y: auto;
    padding: 12px;
    flex-shrink: 0;
    transition: margin-left 0.2s;
  }
  #sidebar.hidden { margin-left: -260px; }
  .sidebar-section {
    margin-bottom: 16px;
  }
  .sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    color: #8b949e;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .participant-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: background 0.15s;
    user-select: none;
  }
  .participant-toggle:hover { background: #21262d; }
  .participant-toggle.active { background: #1c2333; }
  .participant-toggle .dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.3;
    transition: opacity 0.15s;
  }
  .participant-toggle.active .dot { opacity: 1; }
  .participant-toggle .info { flex: 1; min-width: 0; }
  .participant-toggle .pname {
    font-size: 13px; font-weight: 500;
    color: #c9d1d9;
  }
  .participant-toggle .ptype {
    font-size: 10px;
    color: #8b949e;
    text-transform: uppercase;
  }
  .participant-toggle .thinking-anim {
    display: none;
    width: 16px; height: 16px;
  }
  .participant-toggle.thinking .thinking-anim {
    display: block;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toggle-switch {
    width: 32px; height: 18px;
    background: #30363d; border-radius: 9px;
    position: relative; flex-shrink: 0;
    transition: background 0.15s;
  }
  .participant-toggle.active .toggle-switch { background: #238636; }
  .toggle-switch::after {
    content: '';
    width: 14px; height: 14px;
    background: #e6edf3;
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
    transition: transform 0.15s;
  }
  .participant-toggle.active .toggle-switch::after { transform: translateX(14px); }
  /* Chat area */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    background: #1f6feb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant {
    align-self: flex-start;
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom-left-radius: 4px;
  }
  .message .sender {
    font-size: 12px; font-weight: 600;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .message .sender .dot {
    width: 8px; height: 8px;
    border-radius: 50%; display: inline-block;
  }
  .badge {
    font-size: 9px;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .badge-agent { background: #238636; color: #fff; }
  .badge-model { background: #30363d; color: #8b949e; }
  .message .content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message .content code {
    background: #0d1117; padding: 2px 6px;
    border-radius: 4px; font-size: 13px;
  }
  .message .content pre {
    background: #0d1117; padding: 12px;
    border-radius: 8px; overflow-x: auto; margin: 8px 0;
  }
  .thinking-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; font-size: 13px; color: #8b949e;
    animation: fadeIn 0.3s ease;
  }
  .thinking-dots { display: flex; gap: 4px; }
  .thinking-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(1) { animation-delay: 0s; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-8px); opacity: 1; }
  }
  #input-area {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 16px 20px;
    display: flex; gap: 10px;
  }
  #input-area textarea {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 48px; max-height: 120px;
    line-height: 1.4;
  }
  #input-area textarea:focus { outline: none; border-color: #58a6ff; }
  .btn-send {
    background: #238636; color: white; border: none;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .btn-send:hover { background: #2ea043; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-discuss {
    background: #21262d; border: 1px solid #30363d;
    color: #c9d1d9; padding: 12px 16px; border-radius: 10px;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn-discuss:hover { background: #30363d; }
  .active-count {
    background: #238636; color: white;
    font-size: 11px; padding: 2px 7px;
    border-radius: 10px; font-weight: 600;
  }
</style>
</head>
<body>
<header>
  <h1>AI Roundtable</h1>
  <div class="controls">
    <button class="btn" onclick="toggleSidebar()">Participants</button>
    <button class="btn" onclick="clearChat()">Clear</button>
  </div>
</header>
<div class="main-area">
  <div id="sidebar"></div>
  <div id="chat-area">
    <div id="chat"></div>
    <div id="input-area">
      <textarea id="input" placeholder="Ask something... all active AIs will respond" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button onclick="requestCrosstalk()" class="btn-discuss" title="Let AIs discuss each other's responses">Discuss</button>
      <button onclick="send()" class="btn-send" id="btn-send">Send</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sidebar = document.getElementById('sidebar');
const btnSend = document.getElementById('btn-send');
let ws;
let thinkingEls = {};
let participants = [];

function toggleSidebar() {
  sidebar.classList.toggle('hidden');
}

function renderSidebar() {
  const models = participants.filter(p => p.type === 'model');
  const agents = participants.filter(p => p.type === 'agent');
  const activeCount = participants.filter(p => p.enabled).length;

  let html = '';

  html += `<div class="sidebar-section">
    <h3>AI Models <span class="active-count">${models.filter(m=>m.enabled).length}</span></h3>`;
  models.forEach(p => {
    html += `<div class="participant-toggle ${p.enabled ? 'active' : ''}" onclick="toggleParticipant('${p.name}')">
      <span class="dot" style="background:${p.color}"></span>
      <div class="info">
        <div class="pname">${p.name}</div>
        <div class="ptype">${p.id}</div>
      </div>
      <div class="toggle-switch"></div>
    </div>`;
  });
  html += '</div>';

  html += `<div class="sidebar-section">
    <h3>Agents <span class="active-count">${agents.filter(a=>a.enabled).length}</span></h3>`;
  agents.forEach(p => {
    html += `<div class="participant-toggle ${p.enabled ? 'active' : ''}" onclick="toggleParticipant('${p.name}')">
      <span class="dot" style="background:${p.color}"></span>
      <div class="info">
        <div class="pname">${p.name}</div>
        <div class="ptype">${p.id}</div>
      </div>
      <div class="toggle-switch"></div>
    </div>`;
  });
  html += '</div>';

  sidebar.innerHTML = html;
}

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => console.log('Connected');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'participants') {
      participants = data.data;
      renderSidebar();
    } else if (data.type === 'message') {
      removeThinking(data.name);
      addMessage(data);
      btnSend.disabled = false;
    } else if (data.type === 'thinking') {
      showThinking(data.name, data.color);
    } else if (data.type === 'clear') {
      chat.innerHTML = '';
    }
  };

  ws.onclose = () => {
    console.log('Disconnected, reconnecting...');
    setTimeout(connect, 2000);
  };
}

function toggleParticipant(name) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'toggle', name: name}));
  }
}

function addMessage(data) {
  const div = document.createElement('div');
  div.className = `message ${data.role}`;

  if (data.role === 'assistant') {
    const badgeClass = data.badge === 'agent' ? 'badge-agent' : 'badge-model';
    const badgeText = data.badge === 'agent' ? 'Agent' : 'Model';
    div.innerHTML = `
      <div class="sender">
        <span class="dot" style="background:${data.color}"></span>
        ${data.name}
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="content">${formatContent(data.content)}</div>
    `;
  } else {
    div.innerHTML = `<div class="content">${escapeHtml(data.content)}</div>`;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showThinking(name, color) {
  if (thinkingEls[name]) return;
  const div = document.createElement('div');
  div.className = 'thinking-indicator';
  div.innerHTML = `
    <span class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;display:inline-block"></span>
    ${name} is thinking
    <span class="thinking-dots">
      <span style="background:${color}"></span>
      <span style="background:${color}"></span>
      <span style="background:${color}"></span>
    </span>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  thinkingEls[name] = div;
}

function removeThinking(name) {
  if (thinkingEls[name]) {
    thinkingEls[name].remove();
    delete thinkingEls[name];
  }
}

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: 'message', content: text}));
  input.value = '';
  input.style.height = 'auto';
  btnSend.disabled = true;
}

function requestCrosstalk() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: 'crosstalk'}));
}

function clearChat() {
  fetch('/api/clear', {method: 'POST'});
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatContent(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

connect();
</script>
</body>
</html>
