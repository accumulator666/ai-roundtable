<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Roundtable</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #58a6ff;
  }
  header .controls {
    display: flex;
    gap: 8px;
  }
  header button {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: #30363d; }
  .participants {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .participant {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 16px;
    background: #21262d;
  }
  .participant .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .participant.thinking .dot {
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    position: relative;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    background: #1f6feb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant {
    align-self: flex-start;
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom-left-radius: 4px;
  }
  .message .sender {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .message .sender .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .message .content {
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .message .content p { margin-bottom: 8px; }
  .message .content p:last-child { margin-bottom: 0; }
  .message .content code {
    background: #0d1117;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .message .content pre {
    background: #0d1117;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .thinking-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 13px;
    color: #8b949e;
    animation: fadeIn 0.3s ease;
  }
  .thinking-dots {
    display: flex;
    gap: 4px;
  }
  .thinking-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(1) { animation-delay: 0s; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-8px); opacity: 1; }
  }
  #input-area {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 16px 20px;
    display: flex;
    gap: 10px;
  }
  #input-area textarea {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #e6edf3;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.4;
  }
  #input-area textarea:focus {
    outline: none;
    border-color: #58a6ff;
  }
  #input-area button {
    background: #238636;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #input-area button:hover { background: #2ea043; }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  #input-area .btn-secondary {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
  }
  #input-area .btn-secondary:hover { background: #30363d; }
</style>
</head>
<body>
<header>
  <h1>AI Roundtable</h1>
  <div class="controls">
    <button onclick="clearChat()">Clear Chat</button>
  </div>
</header>
<div class="participants" id="participants"></div>
<div id="chat"></div>
<div id="input-area">
  <textarea id="input" placeholder="Ask something... all AIs will respond and discuss" rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
  <button onclick="requestCrosstalk()" class="btn-secondary" id="btn-discuss" title="Let AIs discuss each other's responses">Discuss</button>
  <button onclick="send()" id="btn-send">Send</button>
</div>

<script>
const models = [
  {id: "claude-sonnet-4-5", name: "Claude", color: "#cc785c"},
  {id: "grok-3-mini", name: "Grok", color: "#1da1f2"},
  {id: "deepseek-chat", name: "DeepSeek", color: "#4a90d9"},
];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const participants = document.getElementById('participants');
const btnSend = document.getElementById('btn-send');
const btnDiscuss = document.getElementById('btn-discuss');
let ws;
let thinkingEls = {};

function renderParticipants() {
  participants.innerHTML = '<span style="font-size:12px;color:#8b949e;margin-right:4px">Participants:</span>';
  participants.innerHTML += '<div class="participant"><span class="dot" style="background:#238636"></span>You</div>';
  models.forEach(m => {
    participants.innerHTML += `<div class="participant" id="p-${m.name}"><span class="dot" style="background:${m.color}"></span>${m.name}</div>`;
  });
}

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);

  ws.onopen = () => console.log('Connected');

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'message') {
      removeThinking(data.name);
      addMessage(data);
      btnSend.disabled = false;
    } else if (data.type === 'thinking') {
      showThinking(data.name, data.color);
    } else if (data.type === 'clear') {
      chat.innerHTML = '';
    }
  };

  ws.onclose = () => {
    console.log('Disconnected, reconnecting...');
    setTimeout(connect, 2000);
  };
}

function addMessage(data) {
  const div = document.createElement('div');
  div.className = `message ${data.role}`;

  if (data.role === 'assistant') {
    div.innerHTML = `
      <div class="sender">
        <span class="dot" style="background:${data.color}"></span>
        ${data.name}
      </div>
      <div class="content">${formatContent(data.content)}</div>
    `;
  } else {
    div.innerHTML = `<div class="content">${escapeHtml(data.content)}</div>`;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showThinking(name, color) {
  if (thinkingEls[name]) return;
  const div = document.createElement('div');
  div.className = 'thinking-indicator';
  div.id = `thinking-${name}`;
  div.innerHTML = `
    <span class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;display:inline-block"></span>
    ${name} is thinking
    <span class="thinking-dots">
      <span style="background:${color}"></span>
      <span style="background:${color}"></span>
      <span style="background:${color}"></span>
    </span>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  thinkingEls[name] = div;

  const p = document.getElementById(`p-${name}`);
  if (p) p.classList.add('thinking');
}

function removeThinking(name) {
  if (thinkingEls[name]) {
    thinkingEls[name].remove();
    delete thinkingEls[name];
  }
  const p = document.getElementById(`p-${name}`);
  if (p) p.classList.remove('thinking');
}

function send() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: 'message', content: text}));
  input.value = '';
  input.style.height = 'auto';
  btnSend.disabled = true;
}

function requestCrosstalk() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type: 'crosstalk'}));
}

function clearChat() {
  fetch('/api/clear', {method: 'POST'});
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatContent(text) {
  // Basic markdown-ish formatting
  let html = escapeHtml(text);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

// Auto-resize textarea
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

renderParticipants();
connect();
</script>
</body>
</html>
